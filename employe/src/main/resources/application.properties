spring.application.name=employe

# Port d'execution du microservice Employe
server.port=8081

# Ne pas recreer la base a chaque demarrage
spring.jpa.hibernate.ddl-auto=update

# Base H2 fichier dediee au microservice Employe
spring.datasource.url=jdbc:h2:file:./employe
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2 : http://localhost:8081/h2
spring.h2.console.enabled=true
spring.h2.console.path=/h2
