<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page listing</title>
  </head>
  <body>
    <header id="entete">
      <h1>Page listing</h1>
    </header>

    <main>
      <section id="presentation">
        <h2>Titre</h2>
        <p>Description site / page</p>
      </section>

      <section id="entreprises">
        <h2>Sous titre : tableau des entreprises</h2>
      </section>
    </main>

    <footer id="pied-page">
      <p>Copyright</p>
    </footer>

    <script>
      fetch("http://localhost:9090/api/entreprises")
        .then((response) => {
          if (!response.ok) {
            throw new Error("Erreur lors de la récupération des entreprises");
          }
          return response.json();
        })
        .then((data) => {
          const entreprisesSection = document.getElementById("entreprises");
          const table = document.createElement("table");
          const thead = document.createElement("thead");
          const tbody = document.createElement("tbody");

          const headerRow = document.createElement("tr");
          ["ID", "Nom"].forEach((text) => {
            const th = document.createElement("th");
            th.textContent = text;
            headerRow.appendChild(th);
          });
          thead.appendChild(headerRow);

          data.forEach((entreprise) => {
            const row = document.createElement("tr");

            const idCell = document.createElement("td");
            idCell.textContent = entreprise.id;
            row.appendChild(idCell);

            const nomCell = document.createElement("td");
            nomCell.textContent = entreprise.nom;
            row.appendChild(nomCell);

            tbody.appendChild(row);
          });

          table.appendChild(thead);
          table.appendChild(tbody);
          entreprisesSection.appendChild(table);
        });
    </script>
  </body>
</html>
