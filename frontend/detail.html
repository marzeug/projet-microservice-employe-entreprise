<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page de détail</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="entete">
      <h1>Page de détail</h1>
    </header>

    <main>
      <article>
        <header id="presentation">
          <h2>Titre</h2>
          <p>Description site / page</p>
          <img src="" alt="Image de l'entreprise" />
          <h3>Nom</h3>
        </header>

        <section id="employes">
          <h3>Employés</h3>
        </section>

        <section id="formulaire">
          <h3>Formulaire</h3>

          <form action="#" method="post">
            <p>
              <label for="nom">Nom</label>
              <input type="text" id="nom" name="nom" required />
            </p>

            <button id="bouton-envoyer" type="submit">Envoyer</button>
          </form>
          <p id="message-formulaire"></p>
        </section>
      </article>
    </main>

    <footer id="pied-page">
      <p>Copyright</p>
    </footer>

    <script>
      const API_URL = "http://localhost:9090/api/entreprises";

      const formulaire = document.querySelector("#formulaire form");
      const champNom = document.getElementById("nom");
      const boutonEnvoyer = document.getElementById("bouton-envoyer");
      const messageFormulaire = document.getElementById("message-formulaire");

      formulaire.addEventListener("submit", (event) => {
        event.preventDefault();

        const nom = champNom.value.trim();
        if (!nom) {
          return;
        }

        boutonEnvoyer.disabled = true;
        messageFormulaire.textContent = "";

        fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nom, idEmployes: [] }),
        })
          .then((response) => {
            if (!response.ok) {
              throw new Error("Erreur lors de la création de l'entreprise");
            }
            return response.json();
          })
          .then((entrepriseCreee) => {
            messageFormulaire.textContent = `Entreprise "${entrepriseCreee.nom}" créée (id ${entrepriseCreee.id}).`;
            formulaire.reset();
          })
          .catch((erreur) => {
            console.error(erreur);
            messageFormulaire.textContent = "Erreur lors de la création de l'entreprise.";
          })
          .finally(() => {
            boutonEnvoyer.disabled = false;
          });
      });
    </script>
  </body>
</html>
